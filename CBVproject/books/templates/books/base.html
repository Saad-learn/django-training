<!DOCTYPE html>
<html>
<head>
    <title>Bookstore</title>
</head>
<body>
    <h1>{% if welcome %}{{ welcome }}{% else %}Bookstore{% endif %}</h1>
    <nav>
        <a href="{% url 'book_list' %}">Books</a> |
        <a href="{% url 'book_create' %}">Add Book</a>
    </nav>
    <hr>
    {% if messages %}
    <ul>
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
    </ul>
    <hr>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
